# Khoa Portfolio - PUBLIC CONTENT repository
#
# ROLE IN THE ARCHITECTURE
#   This repository is the canonical EDITORIAL source: all four content
#   collections and their media are managed here through Pages CMS.
#   The Astro site source, build, QA and deployment stay in the PRIVATE
#   repository khoanvm/khoa-portfolio. Synchronization is one-way
#   (public -> private, via a reviewed pull request). This repository never
#   deploys and holds no source code.
#
#   Edit content HERE, in Pages CMS, against khoanvm/khoa-portfolio-content.
#   Do not edit synchronized articles in the private repository.
#
#   NOTE ON VISIBILITY: every file here is world-readable on GitHub, including
#   anything with `published: false`. Only publishable content belongs here.
#
# WHY THE MEDIA ROOT IS `public`
#   Pages CMS resolves an existing image reference with
#       swapPrefix(storedValue, media.output, media.input, relative = true)
#   and the media API rejects any directory not starting with `media.input`
#   (HTTP 400). With `input: public/uploads` the stored value /assets/... would
#   be rejected; with `input: public` it resolves to public/assets/..., which is
#   where the files actually live. Both are required.
#
#   Because this repository is PUBLIC, inline thumbnails render correctly.
#   (In a private repository they cannot: Pages CMS points <img src> at
#   GitHub's unauthenticated download URL, which 404s.)
#
# NOTHING IS MIGRATED BY CONFIG CHANGE. Image values keep the original
# /assets/... convention, which is the same public URL the live site serves.
# New uploads land in public/uploads and are stored as /uploads/<filename>.
#
# Field reference: https://pagescms.org/docs/configuration/

media:
  input: public
  output: /
  rename: safe
  categories:
    - image

content:
  - name: case-studies
    label: Case Studies
    type: collection
    path: src/content/case-studies
    format: yaml-frontmatter
    subfolders: false
    exclude:
      - README.md
    view:
      primary: title
      sort:
        - field: featured
          order: desc
        - field: order
          order: asc
        - field: publishedAt
          order: desc
      search:
        - title
        - summary
        - client
    operations:
      create: true
      delete: true
    fields:
      # -- shared ------------------------------------------------------------
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        description: >-
          View live article ↗ — the public URL is https://khoanvm.io.vn/case-studies/{slug}/
          (use the value below, or the file name when blank).
          Only published entries are live; drafts return 404.
          Lowercase kebab-case.
        required: false
      - name: summary
        label: Summary
        type: text
      - name: cover
        label: Cover image
        type: image
        description: >-
          Case Study cover: 1600 × 800 (2:1), WebP, ideally under 250 KB. The detail
          page renders 2:1.
          To replace: press the bin icon, then Upload and Select reappear on the empty
          slot. Clearing a reference does not delete the file from GitHub. Open it at full size with the View on GitHub button.
        options:
          path: public/uploads
          extensions: [webp, jpg, jpeg, png]
      - name: coverAlt
        label: Cover alt text
        type: string
        description: Required whenever a cover image is set.
      - name: seoTitle
        label: SEO title
        type: string
        description: Used verbatim. Leave blank to use the title plus site name.
      - name: seoDescription
        label: SEO description
        type: text
      - name: seoImage
        label: SEO / social image
        type: image
        description: >-
          SEO / social image: 1200 × 630 (≈1.91:1), WebP or JPEG, ideally under 200
          KB.
          To replace: press the bin icon, then Upload and Select reappear on the empty
          slot. Clearing a reference does not delete the file from GitHub. Open it at full size with the View on GitHub button.
        options:
          path: public/uploads
          extensions: [webp, jpg, jpeg, png]
      - name: published
        label: Published
        type: boolean
        description: Drafts never reach the built site.
      - name: publishedAt
        label: Published date
        type: date
      - name: featured
        label: Featured
        type: boolean
      - name: order
        label: Manual order
        type: number
        description: Lower sorts first. Leave blank to sort by date.
      - name: gallery
        label: Gallery
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{fields.alt}'
        fields:
          - name: src
            label: Image
            type: image
            description: >-
              Gallery image: 1200–1600 px wide, about 3:2 so it fills the card panes,
              WebP, ideally under 200 KB.
              To replace this one: press the bin icon, then Upload and Select reappear
              on the empty slot. Clearing a reference does not delete the file from
              GitHub. To add another image, press Add below the list instead — that
              creates a new item. Open it at full size with the View on GitHub button.
            options:
              path: public/uploads
              extensions: [webp, jpg, jpeg, png]
            required: true
          - name: alt
            label: Alt text
            type: string
            required: true
          - name: caption
            label: Caption
            type: string
      - name: videos
        label: Videos
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{fields.title}'
        description: >-
          Shown under "Videos", below the photos. Each video needs exactly ONE
          source: a short MP4 upload (at most 60 seconds and 15 MB, H.264) OR a
          YouTube link for anything longer (upload it to YouTube as Unlisted).
        fields:
          - name: title
            label: Title
            type: string
            required: true
            description: Names the video for screen readers and shows under it.
          - name: src
            label: MP4 file (short videos)
            type: file
            description: >-
              MP4 (H.264, 720p), at most 60 seconds and 15 MB. Leave empty when
              you use a YouTube link instead.
            options:
              path: public/uploads
              extensions: [mp4]
          - name: youtube
            label: YouTube link (long videos)
            type: string
            description: >-
              Paste the YouTube link or the 11-character video ID. Leave empty when
              you upload an MP4 instead.
          - name: poster
            label: Poster image (MP4 only)
            type: image
            description: >-
              Frame shown before an MP4 plays: 1280×720 (16:9), WebP, under 150 KB.
              To replace this one: press the bin icon, then Upload and Select reappear
              on the empty slot. Clearing a reference does not delete the file from
              GitHub. Open it at full size with the View on GitHub button.
            options:
              path: public/uploads
              extensions: [webp, jpg, jpeg, png]
          - name: caption
            label: Caption
            type: string
      - name: metrics
        label: Metrics and outcomes
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{fields.label}'
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: value
            label: Value
            type: string
            required: true
            description: Only ever a figure Khoa has supplied.
          - name: detail
            label: Detail
            type: string
          - name: trend
            label: Icon
            type: select
            options:
              - { label: '↑ Increase (green arrow up)', value: up }
              - { label: '↓ Decrease (green arrow down — good news)', value: down }
              - { label: '★ Milestone (star)', value: star }
            description: Shown before the sentence. Leave empty for no icon.
          - name: text
            label: Sentence shown on the page
            type: string
            description: >-
              One short sentence, e.g. "Cost of sale fell from **~30% to below 10%** of revenue".
              Wrap the key figure in **double asterisks** to make it bold.
      # -- case-study specific ----------------------------------------------
      - name: client
        label: Client
        type: string
      - name: role
        label: Role
        type: string
        list: true
      - name: services
        label: Services
        type: string
        list: true
      - name: period
        label: Period
        type: string
        description: For example "2019–2022".
      - name: location
        label: Location
        type: string
      - name: evidenceCaption
        label: Evidence caption
        type: string
      - name: link
        label: Public link
        type: string
      - name: body
        label: Body
        type: rich-text
        options:
          path: public/uploads
        description: >-
          Rich-text image: at most 1200 px wide, WebP, ideally under 200 KB.
          Add, change or remove images freely here — there is no single-image slot to
          fill. Open it at full size with the View on GitHub button.

