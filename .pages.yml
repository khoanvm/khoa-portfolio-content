  # ---------------------------------------------------------------------------
  # HOMEPAGE — a SINGLETON.
  #
  # One document, src/content/homepage/homepage.md, holds only copy the HOMEPAGE owns.
  #
  # Deliberately NOT here: case-study titles, story titles, summaries and cover
  # images. Those are edited once, on their own article, in their own collection,
  # and the homepage renders them from there. Nothing is duplicated, so the
  # homepage can never disagree with the article it is previewing.
  #
  # Featured selection is also not here: mark a story `featured: true` (and set
  # `order` for the sequence) inside the Stories collection.
  # ---------------------------------------------------------------------------
  # Pages CMS supports exactly three content types: collection, file and group.
  # There is no "singleton" type — a single editable document is `type: file`,
  # and its `path` must be the FULL FILENAME, not the containing folder.
  # https://pagescms.org/docs/configuration/content/
  - name: homepage
    label: Homepage
    type: file
    path: src/content/homepage/homepage.md
    format: yaml-frontmatter
    fields:
      - name: published
        label: Published
        type: boolean
        required: true
        description: >-
          Must stay ON. The homepage reads this single document, so switching it
          off leaves the site with no homepage copy at all.

      # ---- Hero -------------------------------------------------------------
      - name: hero
        label: Hero
        type: object
        fields:
          - name: greeting
            label: Greeting
            type: string
            description: First word of the H1, e.g. "Hello".
          - name: wave
            label: Wave emoji
            type: string
            description: The emoji shown after the greeting, e.g. "👋".
          - name: intro
            label: Intro
            type: string
            description: The word before the name, e.g. "I'm".
          - name: name
            label: Name
            type: string
            description: The name run of the H1, e.g. "Khoa Nguyen".
          - name: tagline
            label: Tagline
            type: string
            description: Short positioning line shown under the H1.
          - name: description
            label: Description
            type: text
            description: >-
              Evidence-led statement under the tagline. Use a blank line to start
              a new paragraph.
          - name: ctaPrimary
            label: Primary button
            type: object
            fields:
              - name: label
                label: Label
                type: string
              - name: href
                label: Link
                type: string
                description: Internal path or homepage anchor, e.g. #case-studies
          - name: ctaSecondary
            label: Secondary button
            type: object
            fields:
              - name: label
                label: Label
                type: string
              - name: href
                label: Link
                type: string
                description: Homepage anchor or path, e.g. #opportunities
          - name: markets
            label: International markets
            type: object
            description: >-
              A quiet informational group shown under the Hero buttons. It is
              not navigation — the chips are not links, filters or buttons.
            fields:
              - name: label
                label: Group label
                type: string
                description: >-
                  Uppercase label above the chips, e.g. OPEN TO INTERNATIONAL
                  OPPORTUNITIES.
              - name: items
                label: Markets
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{fields.name}'
                fields:
                  - name: name
                    label: Market name
                    type: string
                    required: true
                    description: The word shown in the chip, e.g. Germany.
                  - name: icon
                    label: Icon
                    type: string
                    description: >-
                      Which small flag or globe to draw beside the name:
                      "de" (Germany), "vn" (Vietnam) or "world" (Worldwide).
                      Any other value shows the name on its own.

      # ---- "What I'm Open To" ----------------------------------------------
      - name: opportunities
        label: "What I'm Open To"
        type: object
        description: >-
          The conversion section shown directly below the Hero on the homepage.
          There is no subtitle — the visible title is generated from the label.
        fields:
          - name: label
            label: Section label
            type: string
            description: >-
              Uppercase source for the heading, e.g. WHAT I'M OPEN TO. The visible
              title is derived from it as "What I'm Open To.".
          - name: anchorId
            label: Section anchor id
            type: string
            description: >-
              The id of the section. The header's Opportunities link targets it,
              so the link and the anchor can never drift apart.
          - name: cards
            label: Opportunity cards
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{fields.title}'
            description: >-
              Three cards today. Each card carries its own FAQ popup, so the card
              copy and the answers stay on the same record.
            fields:
              - name: title
                label: Card title
                type: string
                required: true
              - name: description
                label: Card description
                type: text
                required: true
              - name: supportingText
                label: Supporting text
                type: string
                required: true
                description: >-
                  Quiet line under the description, e.g. "Germany · Vietnam ·
                  International".
              - name: ctaLabel
                label: Card button label
                type: string
                required: true
                description: >-
                  The button that opens the popup, e.g. "Explore roles ↗". The
                  arrow is part of the label so it stays editable.
              - name: modalTitle
                label: Popup title
                type: string
                required: true
              - name: faq
                label: FAQ entries
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{fields.question}'
                description: >-
                  Rendered in order and numbered 01, 02, 03. The same
                  question/answer shape as a Story's "In brief" summary.
                fields:
                  - name: question
                    label: Question
                    type: string
                    required: true
                  - name: answer
                    label: Answer
                    type: text
                    required: true
                    description: A blank line starts a new paragraph.
              - name: modalCtaLabel
                label: Popup button label
                type: string
                required: true
                description: >-
                  Closes the popup and goes to the homepage Contact section, e.g.
                  "Discuss an Opportunity ↗".

      # ---- About ------------------------------------------------------------
      - name: about
        label: About me
        type: object
        fields:
          - name: label
            label: Section label
            type: string
            description: The small caps label above the heading, e.g. ABOUT ME.
          - name: heading
            label: Heading
            type: string
          - name: description
            label: Body
            type: text
            description: Long-form narrative. A blank line starts a new paragraph.
          - name: stats
            label: Statistics
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{fields.value}'
            description: Exactly three metric blocks. Only figures you can stand behind.
            fields:
              - name: value
                label: Value
                type: string
                description: e.g. 200+
              - name: description
                label: Description
                type: string
          - name: links
            label: Discovery links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{fields.label}'
            description: Contextual links rendered under the About copy.
            fields:
              - name: label
                label: Label
                type: string
              - name: href
                label: Link
                type: string

      # ---- Section intros (cards come from their own collections) -----------
      - name: caseStudies
        label: Case Studies section intro
        type: object
        description: >-
          Intro only. The cards below it are rendered from the Case Studies
          collection — never re-entered here.
        fields:
          - name: label
            label: Section label
            type: string
          - name: heading
            label: Heading
            type: string
      - name: stories
        label: Stories section intro
        type: object
        description: >-
          Intro only. The three previews come from the Stories collection and are
          chosen with the "Featured" flag on each story.
        fields:
          - name: label
            label: Section label
            type: string
          - name: heading
            label: Heading
            type: string

      # ---- Quotes -----------------------------------------------------------
      - name: quote1
        label: Quote (first)
        type: object
        fields:
          - name: text
            label: Quote
            type: text
          - name: attribution
            label: Attribution
            type: string
      - name: quote2
        label: Quote (second)
        type: object
        fields:
          - name: text
            label: Quote
            type: text
          - name: attribution
            label: Attribution
            type: string
      # ---- Endorsements -----------------------------------------------------
      - name: endorsements
        label: Endorsements
        type: object
        fields:
          - name: label
            label: Section label
            type: string
          - name: heading
            label: Heading
            type: string
          - name: items
            label: Recommendations
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{fields.name}'
            fields:
              - name: name
                label: Name
                type: string
              - name: role
                label: Role
                type: string
              - name: quote
                label: Full quote
                type: text
                description: Desktop text. Keep it verbatim.
              - name: mobileQuote
                label: Short quote (mobile)
                type: text
                description: >-
                  Verbatim excerpt shown below 768px. This slot is REQUIRED —
                  without it the recommendation renders at zero height on phones.

      # ---- Moments + contact intro -----------------------------------------
      - name: moments
        label: Moments
        type: object
        fields:
          - name: label
            label: Section label
            type: string
          - name: heading
            label: Heading
            type: string
          - name: contact
            label: Contact intro
            type: object
            description: >-
              Copy above the four contact buttons. The four buttons themselves
              (Gmail, LinkedIn, WhatsApp, Zalo) are not editable here — their
              destinations are fixed in the site source so they cannot be broken
              by a content edit.
            fields:
              - name: heading
                label: Heading
                type: string
              - name: description
                label: Description
                type: text

      - name: footer
        label: Footer
        type: object
        fields:
          - name: copyright
            label: Copyright line
            type: string

settings:
  commit:
    templates:
      create: 'content: add {collection} "{title}"'
      update: 'content: update {collection} "{title}"'
      delete: 'content: remove {collection} "{title}"'
      uploadMedia: 'content: add media {filename}'
      deleteMedia: 'content: remove media {filename}'
