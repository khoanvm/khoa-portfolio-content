# Khoa Portfolio - PUBLIC CONTENT repository (Proof of Concept)
#
# SCOPE
#   This repository is an isolated Proof of Concept. It holds ONE published
#   case study (audibene) and its four images so that Pages CMS can be proven to
#   manage content and images from a PUBLIC repository.
#
#   It is NOT the production repository. The Astro site source stays private in
#   khoanvm/khoa-portfolio, which remains the single source of truth for the
#   build. Nothing here deploys.
#
# SAFETY BASIS
#   Every file in this repository was ALREADY world-readable on production at
#   https://khoanvm.io.vn before the repository was created:
#     /case-studies/audibene/                     -> 200 text/html
#     /assets/figma/case-studies/audibene-article.png -> 200 image/png
#     /assets/figma/case-studies/index-audibene-1.png -> 200 image/png
#     /assets/figma/case-studies/index-audibene-2.png -> 200 image/png
#     /assets/figma/case-studies/index-audibene-3.png -> 200 image/png
#   Publishing it here discloses nothing that is not already public.
#
# WHY THE MEDIA ROOT IS `public`
#   Pages CMS does not resolve an existing image reference against the whole
#   repository. `read()` in fields/core/image/index.tsx converts a stored value
#   from the `output` form to the repo form:
#       swapPrefix(storedValue, media.output, media.input, relative = true)
#   and the media API rejects any directory that does not start with
#   `media.input` (app/api/.../media/[name]/[path]/route.ts -> HTTP 400).
#   With `input: public/uploads` the stored value /assets/figma/... would be
#   rejected. With `input: public` it resolves to
#   public/assets/figma/... which is exactly where the file lives.
#
#   NOTE: the inline thumbnail only renders because this repository is PUBLIC.
#   Pages CMS serves `<img src>` from GitHub's unauthenticated download_url, so
#   on a PRIVATE repository every thumbnail 404s. See docs/COMPATIBILITY.md.
#
# NOTHING IS MIGRATED. No frontmatter value is rewritten and no image path
# changes: values stay in the original `/assets/...` convention, which is the
# same public URL the live site already serves.
#
# Field reference: https://pagescms.org/docs/configuration/

media:
  input: public
  output: /
  rename: safe
  categories:
    - image

content:
  - name: case-studies
    label: Case Studies
    type: collection
    path: src/content/case-studies
    format: yaml-frontmatter
    exclude:
      - README.md
    view:
      primary: title
      sort:
        - field: featured
          order: desc
        - field: order
          order: asc
        - field: publishedAt
          order: desc
      search:
        - title
        - summary
        - client
    operations:
      create: true
      delete: true
    fields:
      # -- shared ------------------------------------------------------------
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        description: >-
          View live article ↗ — the public URL is https://khoanvm.io.vn/case-studies/{slug}/
          (use the value below, or the file name when blank).
          Only published entries are live; drafts return 404.
          Lowercase kebab-case.
        required: false
      - name: summary
        label: Summary
        type: text
      - name: cover
        label: Cover image
        type: image
        description: >-
          Case Study cover: 1600 × 800 (2:1), WebP, ideally under 250 KB. The detail
          page renders 2:1.
          To replace: press the bin icon, then Upload and Select reappear on the empty
          slot. Clearing a reference does not delete the file from GitHub. If the
          preview shows a grey box, use the View on GitHub button to confirm the image.
        options:
          path: public/uploads
          extensions: [webp, jpg, jpeg, png]
      - name: coverAlt
        label: Cover alt text
        type: string
        description: Required whenever a cover image is set.
      - name: seoTitle
        label: SEO title
        type: string
        description: Used verbatim. Leave blank to use the title plus site name.
      - name: seoDescription
        label: SEO description
        type: text
      - name: seoImage
        label: SEO / social image
        type: image
        description: >-
          SEO / social image: 1200 × 630 (≈1.91:1), WebP or JPEG, ideally under 200
          KB.
          To replace: press the bin icon, then Upload and Select reappear on the empty
          slot. Clearing a reference does not delete the file from GitHub. If the
          preview shows a grey box, use the View on GitHub button to confirm the image.
        options:
          path: public/uploads
          extensions: [webp, jpg, jpeg, png]
      - name: published
        label: Published
        type: boolean
        description: Drafts never reach the built site.
      - name: publishedAt
        label: Published date
        type: date
      - name: featured
        label: Featured
        type: boolean
      - name: order
        label: Manual order
        type: number
        description: Lower sorts first. Leave blank to sort by date.
      - name: gallery
        label: Gallery
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{fields.alt}'
        fields:
          - name: src
            label: Image
            type: image
            description: >-
              Gallery image: 1200–1600 px wide, about 3:2 so it fills the card panes,
              WebP, ideally under 200 KB.
              To replace this one: press the bin icon, then Upload and Select reappear
              on the empty slot. Clearing a reference does not delete the file from
              GitHub. To add another image, press Add below the list instead — that
              creates a new item. If the preview shows a grey box, use the View on
              GitHub button to confirm the image.
            options:
              path: public/uploads
              extensions: [webp, jpg, jpeg, png]
            required: true
          - name: alt
            label: Alt text
            type: string
            required: true
          - name: caption
            label: Caption
            type: string
      - name: metrics
        label: Metrics and outcomes
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{fields.label}'
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: value
            label: Value
            type: string
            required: true
            description: Only ever a figure Khoa has supplied.
          - name: detail
            label: Detail
            type: string
      # -- case-study specific ----------------------------------------------
      - name: client
        label: Client
        type: string
      - name: role
        label: Role
        type: string
        list: true
      - name: services
        label: Services
        type: string
        list: true
      - name: period
        label: Period
        type: string
        description: For example "2019–2022".
      - name: location
        label: Location
        type: string
      - name: evidenceCaption
        label: Evidence caption
        type: string
      - name: link
        label: Public link
        type: string
      - name: body
        label: Body
        type: rich-text
        options:
          path: public/uploads
        description: >-
          Rich-text image: at most 1200 px wide, WebP, ideally under 200 KB.
          Add, change or remove images freely here — there is no single-image slot to
          fill. If the preview shows a grey box, use the View on GitHub button to
          confirm the image.

settings:
  commit:
    templates:
      create: 'content: add {collection} "{title}"'
      update: 'content: update {collection} "{title}"'
      delete: 'content: remove {collection} "{title}"'
      uploadMedia: 'content: add media {filename}'
      deleteMedia: 'content: remove media {filename}'
